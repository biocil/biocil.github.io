# Site configuration for the Phi-X lab website.
# The look of the site comes from the theme in themes/phix/.
# Content lives in content/; see README.md for how to edit it.

title: Phi-X
baseURL: https://biocil.github.io/
defaultContentLanguage: en
defaultContentLanguageInSubdir: false

# English is the default (at /), Turkish lives under /tr/.
# Turkish pages come from content_tr/; anything not translated there falls back
# to the English page from content/ (publications, news, profiles…).
languages:
  en:
    label: English
    locale: en-US
    weight: 1
  tr:
    label: Türkçe
    locale: tr-TR
    weight: 2

module:
  mounts:
    - source: content_tr
      target: content
      sites:
        matrix:
          languages: ['tr']
    - source: content
      target: content
      sites:
        matrix:
          languages: ['*']
theme: phix

removePathAccents: true
enableRobotsTXT: true
summaryLength: 30
timeout: 300s
ignoreFiles: ['\.ipynb$', '\.ipynb_checkpoints$', '\.Rmd$', '_cache$']

pagination:
  pagerSize: 30

# Taxonomies: "authors" powers the people pages and author links.
taxonomies:
  author: authors
  tag: tags

permalinks:
  term:
    authors: /author/:slug/
    tags: /tag/:slug/

outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]

markup:
  goldmark:
    renderer:
      unsafe: true      # allows raw HTML inside Markdown (used by project pages)
  highlight:
    noClasses: false

imaging:
  resampleFilter: lanczos
  anchor: smart
  jpeg:
    quality: 80
  webp:
    quality: 80

related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: authors
      weight: 60
