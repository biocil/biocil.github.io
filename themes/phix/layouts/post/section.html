{{ define "main" }}
{{ partial "page-head.html" . }}
<div class="wrap page-body">
  {{ range .Pages.ByDate.Reverse.GroupByDate "2006" }}
  <section class="year-group">
    <h2 class="year">{{ .Key }}</h2>
    <ul class="news">{{ range .Pages }}{{ partial "news-item.html" . }}{{ end }}</ul>
  </section>
  {{ end }}
</div>
{{ end }}
