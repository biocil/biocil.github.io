{{- /* The interactive hologram/phase comparison used in the home page hero. */ -}}
<figure class="holo-fig">
  <div class="holo" id="holo">
    <canvas id="holoCanvas" role="img" aria-label="{{ T "hero_canvas" }}"></canvas>
    <span class="tag l">{{ T "phase" }}</span>
    <span class="tag r">{{ T "hologram" }}</span>
    <div class="divider" id="divider"><div class="grip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg></div></div>
    <label class="sr-only" for="holoRange">{{ T "divider_label" }}</label>
    <input id="holoRange" type="range" min="0" max="100" value="50">
  </div>
  <figcaption>{{ T "hero_figcaption" | safeHTML }}</figcaption>
</figure>
